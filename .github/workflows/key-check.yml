name: key-check
on: pull_request
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsSL https://claude.ai/install.sh | bash
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for ep in none claude-code-github-action; do
            if [ "$ep" = none ]; then unset CLAUDE_CODE_ENTRYPOINT; else export CLAUDE_CODE_ENTRYPOINT=$ep; fi
            echo "RESULT[$ep] $(~/.local/bin/claude --bare -p 'Reply OK' --max-turns 1 --output-format json | jq -c '{is_error, result, api_error_status}')"
          done
