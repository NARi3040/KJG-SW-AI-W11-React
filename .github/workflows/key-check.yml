name: key-check
on: pull_request
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "key length: ${#KEY}, prefix: ${KEY:0:7}"
          echo "== models"
          curl -s -o m.json -w "%{http_code}\n" https://api.anthropic.com/v1/models -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01"
          jq -c '{error, ids: [.data[]?.id]}' m.json
          echo "== message"
          curl -s -w "\n%{http_code}\n" https://api.anthropic.com/v1/messages -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" \
            -d '{"model":"claude-opus-5-5","max_tokens":1,"messages":[{"role":"user","content":"hi"}]}'
