name: key-check
on: pull_request
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: curl -fsSL https://claude.ai/install.sh | bash
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ~/.local/bin/claude --version
          ~/.local/bin/claude -p "hi" --max-turns 1 --output-format json || true
          echo "== bare"
          ~/.local/bin/claude --bare -p "hi" --max-turns 1 --output-format json || true
