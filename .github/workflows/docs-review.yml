name: 문서 리뷰

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    paths:
      - "**/*.md"

concurrency:
  group: docs-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: NARi3040/docs-review@v1
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          instructions-path: .github/docs-review.md
          app-client-id: ${{ vars.DOCS_REVIEW_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.DOCS_REVIEW_APP_PRIVATE_KEY }}
