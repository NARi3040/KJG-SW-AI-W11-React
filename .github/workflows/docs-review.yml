name: AI 리뷰

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 리뷰 봇 앱을 설정하기 전에는 건너뛰어요.
    if: github.event.pull_request.draft == false && vars.DOCS_REVIEW_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      # docs-review는 비공개 저장소라 공개 저장소에서 바로 uses로 부를 수 없어요.
      # 앱 토큰으로 체크아웃해 로컬 액션으로 실행하고, 같은 토큰으로 리뷰를 게시해요.
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DOCS_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_REVIEW_APP_PRIVATE_KEY }}
          repositories: |
            ${{ github.event.repository.name }}
            docs-review
          permission-contents: read
          permission-pull-requests: write
          permission-checks: read
          permission-actions: read
      - uses: actions/checkout@v7
        with:
          repository: NARi3040/docs-review
          ref: v2.0.0-rc.4
          token: ${{ steps.app-token.outputs.token }}
          path: .docs-review-action
      - uses: ./.docs-review-action
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          instructions-path: .github/docs-review.md
          github-token: ${{ steps.app-token.outputs.token }}
