name: Claude 문서 리뷰

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    paths:
      - "**/*.md"

concurrency:
  group: claude-docs-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            저장소: ${{ github.repository }}
            PR 번호: ${{ github.event.pull_request.number }}

            이 PR에서 바뀐 Markdown 문서를 리뷰해요. PR 브랜치는 이미 체크아웃되어 있어요.

            1. docs/technical-writing-principles.md를 읽어요. 이 원칙이 리뷰 기준이에요.
            2. gh pr diff로 바뀐 .md 파일을 찾고, 각 파일을 전체로 읽어요.
            3. 원칙에 어긋나는 부분을 찾아요. 링크, 파일 경로, 명령어, 라벨 이름은 Read, Glob, Grep으로 저장소에 실제로 있는지 확인해요.
               docs/design/ 문서는 PLANNING.md의 요구사항 ID와 vnode-spec.md의 용어와도 맞는지 확인해요.
            4. 문제마다 mcp__github_inline_comment__create_inline_comment(confirmed: true)로 인라인 코멘트를 남겨요. 어긋난 원칙, 이유, 수정 초안을 함께 써요.
            5. 마지막에 gh pr comment로 요약을 한 번만 남겨요. 문제가 없으면 한 줄로 남겨요.

            코멘트는 해요체 한국어로 써요. 원칙에 근거하지 않은 취향 지적은 하지 않고, 억지로 코멘트를 만들지 않아요.
            설계 내용 자체를 결정하지 않아요. 빠지거나 모호한 내용은 질문으로 남겨요.
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
