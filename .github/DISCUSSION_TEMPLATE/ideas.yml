body:
  - type: textarea
    id: proposal
    attributes:
      label: 제안
      description: 무엇을 어떻게 정하자는 건지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 이유
      description: 왜 이렇게 하자는 건지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 함께 검토한 다른 방법과 고르지 않은 이유를 적어 주세요.
  - type: textarea
    id: decision
    attributes:
      label: 결정
      description: 처음에는 비워 두고, 논의가 끝나면 본문을 수정해 결과를 적어 주세요.
